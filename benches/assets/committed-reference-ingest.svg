<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Supertable ingest throughput from the committed reference results</title>
  <desc id="desc">Horizontal bars show 38.7 thousand documents per second for FTS-only, 40.6 thousand for vector-only, and 24.2 thousand for SQL. The synthetic dataset contains one million documents in an AWS S3 supertable; cache state is not applicable to ingest.</desc>
  <style>
    text {
      fill: #111827;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 13px; }
    .label { font-size: 15px; font-weight: 600; }
    .value { font-size: 14px; font-weight: 700; }
    .tick { fill: #6b7280; font-size: 12px; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .axis { stroke: #9ca3af; stroke-width: 1.5; }
    .fts { fill: #2563eb; }
    .vector { fill: #0d9488; }
    .sql { fill: #d97706; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f9fafb; }
      .subtitle, .tick { fill: #cbd5e1; }
      .grid { stroke: #475569; }
      .axis { stroke: #64748b; }
      .fts { fill: #60a5fa; }
      .vector { fill: #2dd4bf; }
      .sql { fill: #fbbf24; }
    }
  </style>

  <text class="title" x="32" y="34">Supertable ingest throughput - committed reference</text>
  <text class="subtitle" x="32" y="60">Synthetic | 1M docs | supertable | AWS S3 us-east-1 | cache: N/A (ingest)</text>
  <text class="subtitle" x="32" y="80">16 commits | 256 superfiles | Intel Xeon Platinum 8488C (8C/16T, 31 GiB) | evidence date 2026-06-13</text>

  <line class="axis" x1="250" y1="105" x2="250" y2="315"/>
  <line class="grid" x1="370" y1="105" x2="370" y2="315"/>
  <line class="grid" x1="490" y1="105" x2="490" y2="315"/>
  <line class="grid" x1="610" y1="105" x2="610" y2="315"/>
  <line class="grid" x1="730" y1="105" x2="730" y2="315"/>
  <line class="grid" x1="850" y1="105" x2="850" y2="315"/>

  <text class="tick" x="250" y="333" text-anchor="middle">0</text>
  <text class="tick" x="370" y="333" text-anchor="middle">10</text>
  <text class="tick" x="490" y="333" text-anchor="middle">20</text>
  <text class="tick" x="610" y="333" text-anchor="middle">30</text>
  <text class="tick" x="730" y="333" text-anchor="middle">40</text>
  <text class="tick" x="850" y="333" text-anchor="middle">50 K docs/s</text>

  <text class="label" x="230" y="145" text-anchor="end">FTS-only</text>
  <rect class="fts" x="250" y="120" width="464.4" height="38" rx="5"/>
  <text class="value" x="726.4" y="145">38.7 K/s</text>

  <text class="label" x="230" y="215" text-anchor="end">Vector-only</text>
  <rect class="vector" x="250" y="190" width="487.2" height="38" rx="5"/>
  <text class="value" x="749.2" y="215">40.6 K/s</text>

  <text class="label" x="230" y="285" text-anchor="end">SQL</text>
  <rect class="sql" x="250" y="260" width="290.4" height="38" rx="5"/>
  <text class="value" x="552.4" y="285">24.2 K/s</text>

  <text class="subtitle" x="32" y="365">Source: latest per-modality numeric blocks in benches/README.md; higher is better.</text>
</svg>
